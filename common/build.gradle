architectury {
	common {
		clear()
		add(rootProject.enabledPlatforms.split(','))
		//forgeUsesMojangMappings = true
	}
}

loom {
	accessWidenerPath = file("src/main/resources/advancementplaques.accesswidener")
}

repositories {
	maven {
		name = "WTHIT"
		url = "https://maven.bai.lol"
	}
}

dependencies {
	// We depend on Fabric Loader here to use the Fabric @Environment annotations,
	// which get remapped to the correct annotations on each platform.
	// Do NOT use other classes from Fabric Loader.
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabricLoaderVersion"

	modImplementation fileTree(dir: "../libs", include: ["*.jar"])

	modImplementation "curse.maven:toastcontrol-271740:4711316"
	modImplementation files("../libs/ToastManager-1.21-1.1.0.jar")
	modImplementation "curse.maven:jade-324717:5427840"
	modImplementation "curse.maven:wthit-440979:5447976"
}
